name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # conda-forge's compilers, the toolchain Einsums builds with and the conda-forge package will.
  conda:
    name: conda (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: devtools/conda-envs/environment.yml
          activate-environment: stripes-dev
          conda-remove-defaults: "true"
      # The compiler packages do not all export CXX on activation, and the runner has compilers of its
      # own on PATH, so name the environment's explicitly and fail if it is missing.
      - name: Select the conda compiler
        # Target-prefixed names first (older compiler packages); cxx-compiler 2 installs plain ones.
        run: |
          cxx=""
          for candidate in "$CONDA_PREFIX"/bin/*-conda-linux-gnu-c++ "$CONDA_PREFIX"/bin/*-apple-darwin*-clang++ \
                           "$CONDA_PREFIX/bin/clang++" "$CONDA_PREFIX/bin/g++"; do
            if [ -x "$candidate" ]; then cxx=$candidate; break; fi
          done
          test -n "$cxx" || { echo "::error::no conda-forge C++ compiler in $CONDA_PREFIX/bin"; exit 1; }
          "$cxx" --version
          echo "STRIPES_CONDA_CXX=$cxx" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER="$STRIPES_CONDA_CXX"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4

  # The scalar forms in CUDA translation units, built by nvcc for the device and its host compiler
  # for the host, with no other tests. The runners have no GPU, so gpu.ScalarKernels builds its
  # kernels and reports Skipped; building them is the check that the headers stay device-safe, and
  # gpu.VecInCudaFails that Vec.hpp still refuses a CUDA translation unit.
  cuda:
    name: cuda (${{ matrix.cuda }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.9", "13.4"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: stripes-cuda
          conda-remove-defaults: "true"
      # cuda-nvcc brings the host compiler it supports (gxx_linux-64), and its activation hands that
      # compiler to nvcc through NVCC_PREPEND_FLAGS (-ccbin=$CXX). So CMAKE_CUDA_HOST_COMPILER is
      # left unset: a second -ccbin from CMake makes nvcc warn on every compile.
      - name: Install the CUDA toolkit
        run: conda install -y "cuda-version=${{ matrix.cuda }}" cuda-nvcc cuda-cudart-dev "cmake>=3.24" ninja
      - name: Select the conda compiler
        run: |
          cxx=""
          for candidate in "$CONDA_PREFIX"/bin/*-conda-linux-gnu-c++ "$CONDA_PREFIX/bin/g++"; do
            if [ -x "$candidate" ]; then cxx=$candidate; break; fi
          done
          test -n "$cxx" || { echo "::error::no conda-forge C++ compiler in $CONDA_PREFIX/bin"; exit 1; }
          "$cxx" --version
          nvcc --version
          echo "STRIPES_CONDA_CXX=$cxx" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER="$STRIPES_CONDA_CXX"
          -DCMAKE_CUDA_ARCHITECTURES=80
          -DSTRIPES_WITH_CUDA_TESTS=ON -DSTRIPES_WITH_TESTS=OFF -DSTRIPES_WITH_EXAMPLES=OFF -DSTRIPES_WITH_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Every rung on the runner's own CPU: the baseline and the v2/v3 copies of each suite (v4 too
  # where the runner has AVX-512), the examples, and the per-rung symbol check.
  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++-14
          - compiler: clang
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4

  # The v4 copies on an emulated Sapphire Rapids. SDE emulates CPUID and XGETBV and follows exec,
  # so cpu_features() and the rung guard see a v4 host and nothing may be Skipped.
  sde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Intel SDE
        env:
          SDE_TARBALL: sde-external-10.13.1-2026-07-28-lin.tar.xz
          # Intel's published SHA-256 for this tarball.
          SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$SDE_TARBALL" \
            "https://github.com/petarpetrovt/setup-sde/releases/download/binaries/$SDE_TARBALL"
          echo "$SDE_SHA256  $RUNNER_TEMP/$SDE_TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/$SDE_TARBALL" -C "$RUNNER_TEMP/sde" --strip-components=1
          echo "SDE64=$RUNNER_TEMP/sde/sde64" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build
        run: cmake --build build
      - name: Test under SDE
        run: |
          set -o pipefail
          "$SDE64" -spr -- ctest --test-dir build -j4 --timeout 3600 | tee sde-ctest.log
          # A Skipped test here means the guard did not see the emulated CPU.
          if grep -q "did not run" sde-ctest.log; then
            echo "::error::tests were skipped under SDE"
            exit 1
          fi

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=clang++-18
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4

  # The scalar fallback, on a target with no SIMD at all: 64-bit RISC-V without the vector
  # extension (RV64GC), so every header takes its last branch, with ordinary IEEE float arithmetic.
  # (32-bit x86 without SSE is not used: the x87 unit evaluates expressions at 80 bits, which no
  # flag undoes, so no kernel's vector and scalar forms could agree bit for bit there.)
  scalar:
    runs-on: ubuntu-24.04
    env:
      QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14-riscv64-linux-gnu
      - uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: riscv64
      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/riscv64-linux-gnu.cmake -DSTRIPES_CROSS_GCC_VERSION=-14
      - name: Build
        run: cmake --build build
      - name: Check that the build is the scalar fallback
        run: ./build/examples/example_PlatformInfo | tee platform.log && grep -q "compiled for 0-bit vectors" platform.log
      # Every suite has to run here (no native runner has the scalar fallback), but under emulation the
      # accuracy sweeps run a sixteenth of their points; the native jobs run them in full.
      - name: Test
        env:
          STRIPES_TEST_SWEEP_DIVISOR: "16"
        run: ctest --test-dir build -j4 --timeout 1800

  # NEON on real aarch64 hardware, and the sve<N> copy matching the runner's SVE vector length, if it
  # has SVE (Neoverse N2 runners have SVE2 at 128 bits; the sme copies are Skipped).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      # Whether the runner has SVE, and at what length, decides which sve<N> copies run on silicon.
      - name: CPU features
        run: |
          grep -m1 -i features /proc/cpuinfo
          ./build/examples/example_PlatformInfo
      - name: Test
        run: ctest --test-dir build -j4

  # The sme rung on an emulated core with SVE, SVE2, SME and SME2 (QEMU's -cpu max). binfmt_misc
  # hands every aarch64 binary to qemu-aarch64, including the test the rung guard execs, and the
  # QEMU_* variables reach it from the environment.
  qemu-sme:
    runs-on: ubuntu-24.04
    env:
      QEMU_CPU: max
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14-aarch64-linux-gnu
      # Ubuntu 24.04's QEMU (8.2) has no SME2, so its -cpu max cannot run the sme rung; this image's
      # does, and registers it with binfmt_misc for every aarch64 binary.
      - uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: arm64
      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake -DSTRIPES_CROSS_GCC_VERSION=-14
      - name: Build
        run: cmake --build build
      - name: Check that the emulated CPU has the sme rung
        run: |
          ./build/examples/example_PlatformInfo | tee platform.log
          ./build/stripes_rung_guard sme /bin/true || { echo "::error::the emulated CPU cannot run the sme rung"; exit 1; }
      # Only what needs the emulated core: the sme copies, rung selection and the examples. The NEON
      # baseline copies run natively in linux-arm64, and under emulation the accuracy sweeps (with
      # long double in software on aarch64 Linux) took minutes, so they run a sixteenth of their points.
      - name: Test
        env:
          STRIPES_TEST_SWEEP_DIVISOR: "16"
        run: |
          set -o pipefail
          ctest --test-dir build -j4 --timeout 3600 -R '[.]sme$|RuntimeFeatures|ArchOverride|^example[.]' --no-tests=error \
            | tee qemu-ctest.log
          # Only the x86 rungs exist nowhere here; an sme test that did not run means the gate or the
          # guard turned the emulated SME away.
          if grep -E "\.sme .*Skipped" qemu-ctest.log; then
            echo "::error::sme rung tests were skipped under QEMU"
            exit 1
          fi

  # The fixed-length SVE rungs on an emulated core at each vector length: QEMU's -cpu max with
  # sve-default-vector-length set in bytes. The length's own copies must run (the others are Skipped,
  # since an sve<N> rung runs only where the vector length is exactly N).
  qemu-sve:
    name: qemu-sve (${{ matrix.bits }}-bit)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: 128
            bytes: 16
          - bits: 256
            bytes: 32
          - bits: 512
            bytes: 64
    env:
      QEMU_CPU: max,sve-default-vector-length=${{ matrix.bytes }}
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14-aarch64-linux-gnu
      - uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: arm64
      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake -DSTRIPES_CROSS_GCC_VERSION=-14
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          STRIPES_TEST_SWEEP_DIVISOR: "16"
        run: |
          set -o pipefail
          ctest --test-dir build -j4 --timeout 3600 -R '[.]sve(128|256|512)$|RuntimeFeatures|ArchOverride|^example[.]' \
            --no-tests=error | tee qemu-ctest.log
          if grep -E "[.]sve${{ matrix.bits }} .*Skipped" qemu-ctest.log; then
            echo "::error::the sve${{ matrix.bits }} copies were skipped at a ${{ matrix.bits }}-bit vector length"
            exit 1
          fi

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # One cache per job and matrix entry: compiling is most of every job's time.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4

  # clang-cl, Visual Studio's bundled LLVM toolset: the MSVC ABI and libraries with Clang's code
  # generation, which reaches the v2 rung through /clang:-march=x86-64-v2 (the MSVC driver cannot).
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
          max-size: 500M
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      # Ninja rather than the Visual Studio generator, which ignores the compiler launcher, and debug
      # information in the objects (/Z7), since ccache cannot cache /Zi's shared PDB.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_COMPILER=$env:VCINSTALLDIR/Tools/Llvm/x64/bin/clang-cl.exe"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4

  # Install, then build tests/package against the install: find_package, a dispatched kernel and
  # its rung tests, as a library using Stripes would.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTRIPES_WITH_TESTS=OFF \
            -DSTRIPES_WITH_EXAMPLES=OFF -DSTRIPES_WITH_BENCHMARKS=OFF
          cmake --build build
          cmake --install build --prefix "$RUNNER_TEMP/stripes"
      - name: Build the consumer
        run: |
          cmake -S tests/package -B package-build -GNinja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/stripes"
          cmake --build package-build
      - name: Test the consumer
        run: ctest --test-dir package-build
