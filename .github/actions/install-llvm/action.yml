name: Install LLVM
description: Install clang and its sanitizer runtimes from apt.llvm.org, after checking the repository key against its known fingerprint.
inputs:
  version:
    description: The LLVM major version.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        LLVM_VERSION: ${{ inputs.version }}
        # The fingerprint apt.llvm.org publishes for its signing key.
        LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
        fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '/^fpr:/ {print $10; exit}')
        test "$fingerprint" = "$LLVM_KEY_FINGERPRINT" || { echo "::error::apt.llvm.org key fingerprint is $fingerprint"; exit 1; }
        sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.asc"
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM_VERSION main" |
          sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "clang-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev"
        "clang++-$LLVM_VERSION" --version
