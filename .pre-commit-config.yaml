repos:
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.10
    hooks:
      - id: cmake-format
        name: Ensure CMake files are formatted correctly
        files: (CMakeLists.txt|.*\.cmake)$
        exclude: (.*build/.*)
        additional_dependencies: [ cmake-format==0.6.10 ]
        args: [ "-c", ".cmake-format.py" ]

  - repo: local
    hooks:
      # The headers declare everything in an inline namespace named for the
      # features they were compiled with, so translation units built for different
      # rungs cannot share a definition. A feature a header tests but the name does
      # not encode reopens that for the feature, silently.
      - id: stripes-isa-tag
        name: Ensure the instruction-set namespace names every tested feature
        entry: devtools/check_isa_tag.py
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: Ensure C++ files are formatted correctly
        files: \.(cpp|hpp)$
        exclude: (.*build/.*)
        args: [ --style=file ]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
      - id: insert-license
        name: "Check license: C++"
        files: \.(cpp|hpp)$
        exclude: (.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "//----------------------------------------------------------------------------------------------|//|//----------------------------------------------------------------------------------------------"
          - --detect-license-in-X-top-lines=3

      - id: insert-license
        name: "Check license: CMake"
        files: (CMakeLists.txt|.*\.cmake)$
        exclude: (.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "#----------------------------------------------------------------------------------------------|#|#----------------------------------------------------------------------------------------------"
          - --detect-license-in-X-top-lines=3

      - id: insert-license
        name: "Check license: Python"
        files: \.py$
        exclude: (.*build/.*)
        args:
          - --license-filepath
          - devtools/LicenseHeader.txt
          - --comment-style
          - "#"
          - --detect-license-in-X-top-lines=3
